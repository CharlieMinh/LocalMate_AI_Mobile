name: localmate_ai_mobile
description: LocalMate AI Android foundation. Mock-only M1 candidate.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.6'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.jpg
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
